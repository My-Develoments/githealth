name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api:
    name: API Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Run API tests
        run: pnpm --filter @githealth/api test

      - name: Run API typecheck
        run: pnpm --filter @githealth/api typecheck

      - name: Run API build
        run: pnpm --filter @githealth/api build

  dependency-audit:
    name: Dependency Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies (high and critical)
        run: pnpm audit --audit-level high

  web:
    name: Web Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Run web tests
        run: pnpm --filter @githealth/web test

      - name: Run web typecheck
        run: pnpm --filter @githealth/web typecheck

      - name: Run web build
        run: pnpm --filter @githealth/web build

  runtime-smoke:
    name: Runtime Smoke Validation
    runs-on: ubuntu-latest
    env:
      API_AUTH_TOKEN: smoke-token
      ALLOWED_GITHUB_ORGS: githealth-labs
      GITHUB_ENDPOINT_RATE_LIMIT_WINDOW_MS: 60000
      GITHUB_ENDPOINT_RATE_LIMIT_MAX_REQUESTS: 60
      PORT: 4010
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build API for smoke run
        run: pnpm --filter @githealth/api build

      - name: Start API and validate liveness/readiness endpoints
        shell: bash
        run: |
          set -euo pipefail

          node apps/api/dist/index.js > /tmp/githealth-api-smoke.log 2>&1 &
          api_pid=$!

          cleanup() {
            kill "$api_pid" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          for _ in {1..20}; do
            if curl --fail --silent "http://127.0.0.1:${PORT}/health" >/tmp/smoke-health.json; then
              break
            fi
            sleep 1
          done

          curl --fail --silent "http://127.0.0.1:${PORT}/health" >/tmp/smoke-health.json
          curl --fail --silent "http://127.0.0.1:${PORT}/ready" >/tmp/smoke-ready.json

          grep -q '"status":"ok"' /tmp/smoke-health.json
          grep -q '"status":"ready"' /tmp/smoke-ready.json

  secret-pattern-check:
    name: Secret Pattern Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Scan tracked files for high-risk secret patterns
        shell: bash
        run: |
          set -euo pipefail

          matches="$(git ls-files | grep -Ev '(^|/)pnpm-lock\.yaml$' | xargs grep -nE '-----BEGIN (RSA|DSA|EC|OPENSSH) PRIVATE KEY-----|ghp_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]{82}|AKIA[0-9A-Z]{16}' || true)"

          if [[ -n "$matches" ]]; then
            echo 'Potential secret material detected in tracked files:'
            echo "$matches"
            exit 1
          fi

          echo 'No high-risk secret patterns detected in tracked files.'

  repository-hygiene:
    name: Repository Hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate whitespace and conflict markers
        run: git diff --check

      - name: Verify ignore patterns for generated artifacts
        shell: bash
        run: |
          missing=0

          if ! grep -qxF 'dist/' .gitignore; then
            echo 'Missing required ignore pattern: dist/'
            missing=1
          fi

          if ! grep -qxF '*.tsbuildinfo' .gitignore; then
            echo 'Missing required ignore pattern: *.tsbuildinfo'
            missing=1
          fi

          if [[ "$missing" -ne 0 ]]; then
            echo 'Add the missing .gitignore pattern(s) listed above.'
            exit 1
          fi

      - name: Detect tracked generated artifacts
        shell: bash
        run: |
          tracked_generated="$(git ls-files | grep -E '(^|/)dist/|\.tsbuildinfo$' || true)"

          if [[ -n "$tracked_generated" ]]; then
            echo 'Tracked generated artifacts detected. Remove them from git tracking:'
            echo "$tracked_generated"
            echo 'Suggested fix: git rm --cached <file> and commit the cleanup.'
            exit 1
          fi

          echo 'No tracked generated artifacts detected.'
